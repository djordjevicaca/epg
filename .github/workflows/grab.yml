name: grab-epg
on:
  schedule:
    - cron: "17 3 * * *"   # svaki dan ~04:17 po našem
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pages: write
  id-token: write
jobs:
  grab:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: keepalive (sprečava gašenje posle 60 dana)
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/grab.yml/enable || true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p public && python grab.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
